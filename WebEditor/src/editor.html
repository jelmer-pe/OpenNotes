<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="editor"></div>

  <div id="toolbar">
    <div id="btn-heading" class="toolbar-btn heading-trigger" onclick="toggleHeadingMenu()" data-tooltip="Heading">
      H<span class="dropdown-arrow">▾</span>
    </div>
    <div id="heading-menu" class="heading-menu">
      <div onclick="toolbarAction('h1')" id="btn-h1" class="heading-option">Heading 1</div>
      <div onclick="toolbarAction('h2')" id="btn-h2" class="heading-option">Heading 2</div>
      <div onclick="toolbarAction('h3')" id="btn-h3" class="heading-option">Heading 3</div>
    </div>

    <div class="toolbar-btn" id="btn-bold" onclick="toolbarAction('bold')" data-tooltip="Bold" data-keys="⌘ B">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
    </div>
    <div class="toolbar-btn" id="btn-italic" onclick="toolbarAction('italic')" data-tooltip="Italic" data-keys="⌘ I">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
    </div>
    <div class="toolbar-btn" id="btn-strike" onclick="toolbarAction('strike')" data-tooltip="Strikethrough" data-keys="⌘ ⇧ S">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H8"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
    </div>

    <div class="toolbar-sep"></div>

    <div class="toolbar-btn" id="btn-code" onclick="toolbarAction('code')" data-tooltip="Code" data-keys="⌘ E">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </div>
    <div class="toolbar-btn" id="btn-link" onclick="toolbarAction('link')" data-tooltip="Link" data-keys="⌘ L">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    </div>
    <div class="toolbar-btn" id="btn-codeblock" onclick="toolbarAction('codeblock')" data-tooltip="Code Block" data-keys="⌘ ⌥ C">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><polyline points="9 8 5 12 9 16"/><polyline points="15 8 19 12 15 16"/></svg>
    </div>

    <div class="toolbar-sep"></div>

    <div class="toolbar-btn" id="btn-blockquote" onclick="toolbarAction('blockquote')" data-tooltip="Blockquote" data-keys="⌘ ⇧ B">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="5" x2="3" y2="19"/><line x1="8" y1="8" x2="21" y2="8"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="16" x2="17" y2="16"/></svg>
    </div>
    <div class="toolbar-btn" id="btn-bullet" onclick="toolbarAction('bullet')" data-tooltip="Bullet List" data-keys="⌘ ⇧ 7">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
    </div>
    <div class="toolbar-btn" id="btn-ordered" onclick="toolbarAction('ordered')" data-tooltip="Numbered List" data-keys="⌘ ⇧ 8">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><text x="4" y="7.5" font-size="6" font-weight="600" fill="currentColor" stroke="none" font-family="system-ui">1</text><text x="4" y="13.5" font-size="6" font-weight="600" fill="currentColor" stroke="none" font-family="system-ui">2</text><text x="4" y="19.5" font-size="6" font-weight="600" fill="currentColor" stroke="none" font-family="system-ui">3</text></svg>
    </div>
    <div class="toolbar-btn" id="btn-checkbox" onclick="toolbarAction('checkbox')" data-tooltip="To-do List" data-keys="⌘ ⇧ ↵">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </div>
  </div>

  <script src="editor.bundle.js"></script>
</body>
</html>
